<svg width="1500" height="420" viewBox="0 0 1500 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sustainable Discounts wordmark">
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="55%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="reef" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b8d4"/>
      <stop offset="55%" stop-color="#0277bd"/>
      <stop offset="100%" stop-color="#014f86"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="55%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <pattern id="mosaicA" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#forest)"/>
      <circle cx="18" cy="16" r="7" fill="#81c784"/>
      <circle cx="53" cy="24" r="8" fill="#388e3c"/>
      <rect x="10" y="50" width="22" height="18" fill="#c5e1a5"/>
      <rect x="44" y="47" width="24" height="20" fill="#66bb6a"/>
    </pattern>
    <pattern id="mosaicB" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#reef)"/>
      <circle cx="20" cy="18" r="7" fill="#80deea"/>
      <circle cx="57" cy="23" r="9" fill="#29b6f6"/>
      <rect x="9" y="48" width="24" height="19" fill="#4dd0e1"/>
      <rect x="42" y="50" width="26" height="16" fill="#00acc1"/>
    </pattern>
    <pattern id="mosaicC" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#sunset)"/>
      <circle cx="22" cy="19" r="8" fill="#ffe082"/>
      <circle cx="55" cy="24" r="9" fill="#ff7043"/>
      <rect x="12" y="49" width="20" height="18" fill="#ffcc80"/>
      <rect x="44" y="48" width="22" height="20" fill="#ff8a65"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <text x="40" y="170" font-family="Poppins, Arial, sans-serif" font-size="158" font-weight="800" letter-spacing="3" fill="url(#mosaicA)">SUSTAINABLE</text>
    <text x="40" y="340" font-family="Poppins, Arial, sans-serif" font-size="170" font-weight="800" letter-spacing="3" fill="url(#mosaicB)">DISCOUNTS</text>
    <text x="1270" y="110" font-family="Poppins, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#mosaicC)">TM</text>
  </g>
</svg>
